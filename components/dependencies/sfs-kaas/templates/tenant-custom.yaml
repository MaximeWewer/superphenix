{{- range $preID, $cluster := .Values.clusters }}
{{- if eq $cluster.location $.Values.location }}

{{- if hasKey $cluster "postInstallChart" }}

{{- $projectID := $.Values.projectID -}}
{{- $controlPlane := $cluster.controlPlane -}}
{{- $controlPlaneDefaults := $.Values.clusterDefaults.controlPlane -}}
{{- $clusterID := include "sfs-kaas.spxEID" (dict "project" $projectID "localID" $preID) }}
{{- $clusterName := "" }}
{{- with $cluster.name }}{{ $clusterName = include "sfs-kaas.validName" . }}{{ end }}
{{- $fqdn := include "sfs-kaas.controlPlaneFqdn" (dict "root" $ "cluster" $cluster "clusterID" $clusterID) }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: post-install-{{ $clusterID }}
  labels:
    {{- include "sfs-kaas.labels" $ | nindent 4 }}
    superphenix.net/resourceEffectiveID: {{ $clusterID | quote }}
    superphenix.net/resourceLocalID: {{ $preID | quote }}
    superphenix.net/resourceName: {{ $cluster.name | quote }}
data:
  script.sh: |-
    #!/bin/bash
    # This script installs a user-defined chart in the tenant cluster

    # Cluster values are passed through environment variables and always
    # quoted: they are never interpolated into the script itself.
    kubeconfig="$(cat /job/kubeconfig)"
    printf '%s\n' "${kubeconfig//10.96.0.1/$KAAS_FQDN}" > /var/run/kubeconfig

    printf '[+] Target cluster:\n\tID: %s\n\tName: %s\n' "$KAAS_CLUSTER_ID" "$KAAS_CLUSTER_NAME"
    echo "[+] Checking if TCP is ready."
    curl -kf "$KAAS_CONTROLPLANE_URL/version" -o /dev/null
    while [ $? != 0 ]
    do
      echo "[+] Waiting 120s for TCP to be ready."
      sleep 120
      echo "[+] Checking if TCP is ready."
      curl -kf "$KAAS_CONTROLPLANE_URL/version" -o /dev/null
    done

    echo "[+] Running helm upgrade."
    # User-provided values are passed through environment variables and always
    # quoted: they are never interpolated into the script itself.
    case "$PIC_REPO_URL" in
      oci://*) set -- "$PIC_REPO_URL/$PIC_CHART_NAME" ;;
      *)       set -- "$PIC_CHART_NAME" --repo "$PIC_REPO_URL" ;;
    esac
    if [ -n "$PIC_CHART_VERSION" ]; then
      set -- "$@" --version "$PIC_CHART_VERSION"
    fi
    helm upgrade --install "$PIC_CHART_NAME" "$@" \
      --namespace "${PIC_NAMESPACE:-default}" \
      --create-namespace \
      --kubeconfig /var/run/kubeconfig \
      -f /job/values/values.yaml
    if [ $? -eq 0 ]; then
      echo "[+] Helm upgrade successful."
      exit 0
    else
      echo "[!] Helm upgrade failed."
      exit 1
    fi

  values.yaml: |-
    # Values passed to the user-defined chart
    # defined under clusters.<cluster>.postInstallChart.values

    {{- if hasKey $cluster.postInstallChart "values" }}
    {{- $cluster.postInstallChart.values | toYaml | nindent 4 }}
    {{- end }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: post-install-{{ $cluster.postInstallChart.revision | default 1 | int }}-{{ $clusterID }}
  labels:
    {{- include "sfs-kaas.labels" $ | nindent 4 }}
    superphenix.net/resourceEffectiveID: {{ $clusterID | quote }}
    superphenix.net/resourceLocalID: {{ $preID | quote }}
    superphenix.net/resourceName: {{ $cluster.name | quote }}
    superphenix.net/ignoreNetworkPolicies: "true"
    superphenix.net/workloadClass: kaas-essentials-job
spec:
  template:
    metadata:
      annotations:
        # We need to use a specialized network that is not restricted by client policies or lack of connectivity
        v1.multus-cni.io/default-network: kube-system/system-isolated-egress
      labels:
        {{- include "sfs-kaas.labels" $ | nindent 8 }}
        superphenix.net/resourceEffectiveID: {{ $clusterID | quote }}
        superphenix.net/resourceLocalID: {{ $preID | quote }}
        superphenix.net/resourceName: {{ $cluster.name | quote }}
        superphenix.net/generated: "true"
        superphenix.net/ignoreNetworkPolicies: "true"
        superphenix.net/workloadClass: kaas-essentials-job
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-job
          image: "alpine/helm:3.19"
          command: ["/job/script/script.sh"]
          env:
            - name: KAAS_FQDN
              value: {{ $fqdn | quote }}
            - name: KAAS_CLUSTER_ID
              value: {{ $clusterID | quote }}
            - name: KAAS_CLUSTER_NAME
              value: {{ $clusterName | quote }}
            - name: KAAS_CONTROLPLANE_URL
              value: {{ printf "https://%s:%d" $fqdn (int $controlPlaneDefaults.network.apiServer.port) | quote }}
            - name: PIC_CHART_NAME
              value: {{ $cluster.postInstallChart.chartName | toString | quote }}
            - name: PIC_CHART_VERSION
              value: {{ $cluster.postInstallChart.chartVersion | default "" | toString | quote }}
            - name: PIC_REPO_URL
              value: {{ $cluster.postInstallChart.repoUrl | toString | quote }}
            - name: PIC_NAMESPACE
              value: {{ $cluster.postInstallChart.namespace | default "" | toString | quote }}
          volumeMounts:
            - name: script
              mountPath: /job/script
            - name: kubeconfig
              mountPath: /job
            - name: values
              mountPath: /job/values
      volumes:
        - name: script
          configMap:
            name: "post-install-{{ $clusterID }}"
            defaultMode: 0777
            items:
            - key: "script.sh"
              path: "script.sh"
        - name: kubeconfig
          secret:
            secretName: "{{ $clusterID }}-admin-kubeconfig"
            defaultMode: 0555
            items:
            - key: admin.conf
              path: kubeconfig
        - name: values
          configMap:
            name: "post-install-{{ $clusterID }}"
            defaultMode: 0555
            items:
            - key: "values.yaml"
              path: "values.yaml"

{{- end }}
{{- end }}
{{- end }}
