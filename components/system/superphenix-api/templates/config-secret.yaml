# The configuration holds credentials (database, JWT, AZ and controller
# secrets): it is stored in a Secret, not a ConfigMap.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "superphenix-api.fullname" . }}
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
stringData:
  config.yaml: |-
    {{- toYaml .Values.config | nindent 4 }}
