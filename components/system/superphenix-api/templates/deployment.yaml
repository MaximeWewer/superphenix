apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "superphenix-api.fullname" . }}
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "superphenix-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "superphenix-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "superphenix-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.jwtSecret.generate .Values.jwtSecret.secretName .Values.azAuthSecrets }}
          env:
            {{- if or .Values.jwtSecret.generate .Values.jwtSecret.secretName }}
            - name: SUPERPHENIX-API_AUTHENTICATION_JWTSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwtSecret.secretName | default (printf "%s-jwt" (include "superphenix-api.fullname" .)) }}
                  key: jwt-secret
            {{- end }}
            {{- range .Values.azAuthSecrets }}
            # Overrides `azs.<az>.authSecret`, which must still be declared in the config.
            - name: {{ printf "SUPERPHENIX-API_AZS_%s_AUTHSECRET" (upper .az) }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "azAuthSecrets[].secretName is required" .secretName }}
                  key: {{ .key | default "auth-secret" }}
                  # A missing Secret leaves the config value in place, and the API
                  # refuses to start if that value is empty or weak.
                  optional: true
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
            - name: admin-http
              containerPort: {{ .Values.containerPorts.adminHttp }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.containerPorts.metrics }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              subPath: config.yaml
              mountPath: /etc/superphenix-api/config.yaml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ template "superphenix-api.fullname" . }}
