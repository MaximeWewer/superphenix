{{- if .Values.authSecret.generate -}}
{{- $secretName := include "superphenix-controller.authSecretName" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "superphenix-controller.fullname" . }}-auth-generator
  labels:
    {{- include "superphenix-controller.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        # Not the controller selector labels: the Service must not route to this pod.
        app.kubernetes.io/name: {{ include "superphenix-controller.name" . }}-auth-generator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: auth-generator
    spec:
      serviceAccountName: {{ include "superphenix-controller.serviceAccountName" . }}
      restartPolicy: OnFailure
      containers:
        - name: auth-generator
          image: {{ .Values.authSecret.image.repository }}:{{ .Values.authSecret.image.tag }}
          command:
            - /bin/sh
            - -c
            - |
              if kubectl get secret {{ $secretName }} > /dev/null 2>&1; then
                echo "Secret {{ $secretName }} already exists"
                exit 0
              fi
              echo "Generating controller shared secret..."
              AUTH_SECRET=$(head -c 4096 /dev/urandom | tr -dc A-Za-z0-9 | head -c 48)
              kubectl create secret generic {{ $secretName }} --from-literal={{ .Values.authSecret.key }}="$AUTH_SECRET"
{{- end }}
