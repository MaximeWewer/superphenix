# The configuration holds credentials (database, JWT, AZ and controller
# secrets): it is stored in a Secret, not a ConfigMap.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "superphenix-controller.fullname" . }}
  labels:
    {{- include "superphenix-controller.labels" . | nindent 4 }}
stringData:
  config.yaml: |-
    {{- $config := .Values.config | default dict -}}
    {{- if .Values.webhook.enabled -}}
      {{- $webhook := dict "enabled" true "address" ":8443" "certFile" "/etc/superphenix-controller/certs/tls.crt" "keyFile" "/etc/superphenix-controller/certs/tls.key" -}}
      {{- $_ := set $config "webhook" $webhook -}}
    {{- end -}}
    {{- toYaml $config | nindent 4 }}

