replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: ghcr.io/super-phenix/superphenix-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# -- Pod-level security context. The image runs as the non-root user 1000.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

admissionPolicy:
  # -- Deny writes by the controller service account outside the project
  # namespaces (`spx-*`), namespaces not named `spx-*`, and pod changes other than
  # metadata (requires Kubernetes 1.30+).
  enabled: true
  # -- Namespaces, besides `spx-*`, where the controller may write
  # (velero-system: BaaS DeleteBackupRequests).
  allowedNamespaces:
    - velero-system
  # -- Actions on violation. Use [Warn, Audit] to validate the policy first.
  validationActions: [Deny]

service:
  type: ClusterIP
  port: 8080


serviceMonitor:
  enabled: true
  portName: "metrics"
  interval: 15s
  scheme: ""
  tlsConfig: {}
  bearerTokenFile: ""
  relabelings: []
  metricRelabelings: []

webhook:
  enabled: true
  failurePolicy: Fail
  secretName: ""
  caBundle: ""
  certManager:
    enabled: true
    issuerRef:
      kind: Issuer
      name: ""

config: {}

networkPolicy:
  # -- Restrict ingress to the controller. Disabled by default: validate it on your
  # CNI first (kubelet probes, remote AZs reaching the controller through the Ingress).
  enabled: false
  # -- Peers allowed to call the controller API port.
  # Add the ingress controller namespace when remote AZs use `ingress`.
  allowedFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: superphenix-api
  # -- Peers allowed to scrape metrics. Empty means any source.
  metricsFrom: []

ingress:
  enabled: false
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  #hosts:
  #  - host: chart-example.local
  #    paths:
  #    - path: /
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

nodeSelector: {}

tolerations: []

affinity: {}